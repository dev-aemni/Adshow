<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adshow Website</title>
    
    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5871246629973328" crossorigin="anonymous"></script>

    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background: #f4f4f9; 
            color: #333; 
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            max-width: 600px; 
            margin: 20px auto; 
        }
        .ad-box { 
            margin: 20px 0; 
            padding: 15px; 
            background: #fafafa; 
            border: 1px dashed #ccc; 
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Adshow Demo Page</h1>
        <p>This page is configured with Google AdSense.</p>

        <!-- Auto/Responsive Ad Block -->
        <div class="ad-box">
            <p style="font-size:12px; color:#888; margin-bottom: 8px;">Advertisement</p>
            <ins class="adsbygoogle"
                 style="display:block"
                 data-ad-client="ca-pub-5871246629973328"
                 data-ad-format="auto"
                 data-full-width-responsive="true"></ins>
            <script>
                 (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>

        <p>Your content will appear here.</p>
    </div>
</body>
</html>
